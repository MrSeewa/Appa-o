<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Degradé de Fondo Azul Eléctrico Frutiger Metro -->
    <linearGradient id="cieloAzul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e1ff" />
      <stop offset="25%" stop-color="#0099ff" />
      <stop offset="65%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#031b4e" />
    </linearGradient>

    <radialGradient id="resplandorCian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0088ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0044aa" stop-opacity="0" />
    </radialGradient>

    <!-- Silueta Oscura Central -->
    <linearGradient id="nubeOscura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0b1226" />
    </linearGradient>

    <!-- Símbolo de Estrella Vectorial con Múltiples Bordes -->
    <g id="estrellaMetro">
      <!-- Borde exterior neón cian -->
      <path d="M 0,-70 L 21,-22 L 67,-22 L 30,6 L 44,53 L 0,25 L -44,53 L -30,6 L -67,-22 L -21,-22 Z"
            fill="#000000" stroke="#00f0ff" stroke-width="12" stroke-linejoin="round" />
      <!-- Borde intermedio negro -->
      <path d="M 0,-62 L 18,-19 L 59,-19 L 26,5 L 39,47 L 0,22 L -39,47 L -26,5 L -59,-19 L -18,-19 Z"
            fill="#050b18" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <!-- Borde interno cian brillante -->
      <path d="M 0,-50 L 14,-15 L 47,-15 L 21,4 L 31,37 L 0,18 L -31,37 L -21,4 L -47,-15 L -14,-15 Z"
            fill="#00d2ff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />
    </g>

    <!-- Símbolo de Estrella Simple -->
    <g id="estrellaSimple">
      <path d="M 0,-50 L 15,-15 L 48,-15 L 21,5 L 31,38 L 0,19 L -31,38 L -21,5 L -48,-15 L -15,-15 Z"
            fill="#050a16" stroke="#00f0ff" stroke-width="9" stroke-linejoin="round" />
      <path d="M 0,-40 L 12,-12 L 38,-12 L 17,4 L 25,30 L 0,15 L -25,30 L -17,4 L -38,-12 L -12,-12 Z"
            fill="#00f0ff" />
    </g>
  </defs>

  <!-- Fondo Base Eléctrico -->
  <rect width="1600" height="2400" fill="url(#cieloAzul)" />

  <!-- Destellos y Halos Luminosos -->
  <circle cx="200" cy="300" r="450" fill="url(#resplandorCian)" />
  <circle cx="1400" cy="2100" r="500" fill="url(#resplandorCian)" />

  <!-- =========================================================
       PATRÓN DE SEMITONOS / HALFTONE DOT MATRIX
       ========================================================= -->
  <g fill="#00e5ff" opacity="0.45">
    <!-- Matriz de puntos inferior derecha -->
    <circle cx="1100" cy="1820" r="14" /><circle cx="1140" cy="1820" r="14" /><circle cx="1180" cy="1820" r="13" /><circle cx="1220" cy="1820" r="12" /><circle cx="1260" cy="1820" r="10" />
    <circle cx="1100" cy="1860" r="13" /><circle cx="1140" cy="1860" r="13" /><circle cx="1180" cy="1860" r="12" /><circle cx="1220" cy="1860" r="10" /><circle cx="1260" cy="1860" r="8" />
    <circle cx="1100" cy="1900" r="12" /><circle cx="1140" cy="1900" r="12" /><circle cx="1180" cy="1900" r="10" /><circle cx="1220" cy="1900" r="8" /><circle cx="1260" cy="1900" r="6" />
    <circle cx="1100" cy="1940" r="11" /><circle cx="1140" cy="1940" r="10" /><circle cx="1180" cy="1940" r="8" /><circle cx="1220" cy="1940" r="6" /><circle cx="1260" cy="1940" r="4" />
    <circle cx="1100" cy="1980" r="9" /><circle cx="1140" cy="1980" r="8" /><circle cx="1180" cy="1980" r="6" /><circle cx="1220" cy="1980" r="4" />
    
    <!-- Matriz de puntos superior izquierda -->
    <circle cx="280" cy="480" r="12" /><circle cx="320" cy="480" r="12" /><circle cx="360" cy="480" r="10" /><circle cx="400" cy="480" r="8" />
    <circle cx="280" cy="520" r="11" /><circle cx="320" cy="520" r="10" /><circle cx="360" cy="520" r="8" /><circle cx="400" cy="520" r="6" />
    <circle cx="280" cy="560" r="10" /><circle cx="320" cy="560" r="8" /><circle cx="360" cy="560" r="6" />
  </g>

  <!-- =========================================================
       SILUETAS Y NUBES ORGÁNICAS NEGRAS (FONDO CENTRAL CONTRASTADO)
       ========================================================= -->
  <g fill="url(#nubeOscura)">
    <!-- Burbujas y masa central orgánica -->
    <circle cx="450" cy="850" r="320" />
    <circle cx="780" cy="980" r="420" />
    <circle cx="1150" cy="900" r="380" />
    <circle cx="280" cy="1150" r="360" />
    <circle cx="700" cy="1280" r="460" />
    <circle cx="1220" cy="1220" r="440" />
    <circle cx="400" cy="1550" r="400" />
    <circle cx="850" cy="1620" r="460" />
    <circle cx="1320" cy="1500" r="350" />
    
    <!-- Siluetas laterales que conectan -->
    <path d="M 0,700 Q 200,800 150,1100 Q 80,1400 0,1600 Z" />
    <path d="M 1600,650 Q 1400,900 1450,1250 Q 1520,1500 1600,1700 Z" />
  </g>

  <!-- =========================================================
       CÍRCULOS CONCÉNTRICOS / TARGET RINGS (SUPERIOR DERECHA)
       ========================================================= -->
  <g id="anillosSuperiorDerecha">
    <!-- Grupo Principal 1 -->
    <g transform="translate(1320, 360)">
      <circle cx="0" cy="0" r="280" fill="#00e5ff" stroke="#000000" stroke-width="26" />
      <circle cx="0" cy="0" r="238" fill="#ffffff" stroke="#000000" stroke-width="20" />
      <circle cx="0" cy="0" r="185" fill="#050b18" stroke="#ffffff" stroke-width="12" />
      <circle cx="0" cy="0" r="145" fill="#00f0ff" stroke="#000000" stroke-width="18" />
      <circle cx="0" cy="0" r="95" fill="#ffffff" stroke="#050b18" stroke-width="14" />
      <circle cx="0" cy="0" r="50" fill="#000000" />
      <circle cx="0" cy="0" r="24" fill="#00f0ff" />
    </g>

    <!-- Anillo secundario superpuesto -->
    <g transform="translate(1020, 240)">
      <circle cx="0" cy="0" r="190" fill="#000000" stroke="#00e5ff" stroke-width="18" />
      <circle cx="0" cy="0" r="155" fill="#ffffff" stroke="#000000" stroke-width="16" />
      <circle cx="0" cy="0" r="115" fill="#00d2ff" stroke="#000000" stroke-width="14" />
      <circle cx="0" cy="0" r="75" fill="#050b18" stroke="#ffffff" stroke-width="10" />
      <circle cx="0" cy="0" r="40" fill="#ffffff" />
      <circle cx="0" cy="0" r="18" fill="#000000" />
    </g>

    <!-- Anillo mediano decorativo -->
    <g transform="translate(1480, 720)">
      <circle cx="0" cy="0" r="160" fill="#ffffff" stroke="#000000" stroke-width="18" />
      <circle cx="0" cy="0" r="126" fill="#000000" stroke="#00f0ff" stroke-width="12" />
      <circle cx="0" cy="0" r="90" fill="#00f0ff" stroke="#000000" stroke-width="14" />
      <circle cx="0" cy="0" r="50" fill="#ffffff" stroke="#000000" stroke-width="8" />
      <circle cx="0" cy="0" r="22" fill="#000000" />
    </g>

    <!-- Mini diana flotante -->
    <g transform="translate(800, 140)">
      <circle cx="0" cy="0" r="95" fill="#00e5ff" stroke="#000000" stroke-width="12" />
      <circle cx="0" cy="0" r="72" fill="#000000" stroke="#ffffff" stroke-width="8" />
      <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#000000" stroke-width="8" />
      <circle cx="0" cy="0" r="20" fill="#00f0ff" />
    </g>
  </g>

  <!-- =========================================================
       CÍRCULOS CONCÉNTRICOS / TARGET RINGS (INFERIOR IZQUIERDA)
       ========================================================= -->
  <g id="anillosInferiorIzquierda">
    <!-- Grupo Gigante Inferior Izquierdo -->
    <g transform="translate(280, 2080)">
      <circle cx="0" cy="0" r="360" fill="#00d2ff" stroke="#000000" stroke-width="32" />
      <circle cx="0" cy="0" r="305" fill="#ffffff" stroke="#000000" stroke-width="24" />
      <circle cx="0" cy="0" r="240" fill="#050b18" stroke="#ffffff" stroke-width="16" />
      <circle cx="0" cy="0" r="185" fill="#00f0ff" stroke="#000000" stroke-width="22" />
      <circle cx="0" cy="0" r="120" fill="#ffffff" stroke="#050b18" stroke-width="16" />
      <circle cx="0" cy="0" r="68" fill="#000000" />
      <circle cx="0" cy="0" r="32" fill="#00f0ff" />
    </g>

    <!-- Anillo mediano conectado -->
    <g transform="translate(680, 1850)">
      <circle cx="0" cy="0" r="210" fill="#000000" stroke="#00e5ff" stroke-width="20" />
      <circle cx="0" cy="0" r="172" fill="#ffffff" stroke="#000000" stroke-width="16" />
      <circle cx="0" cy="0" r="128" fill="#00d2ff" stroke="#000000" stroke-width="14" />
      <circle cx="0" cy="0" r="82" fill="#050b18" stroke="#ffffff" stroke-width="10" />
      <circle cx="0" cy="0" r="42" fill="#ffffff" />
      <circle cx="0" cy="0" r="18" fill="#000000" />
    </g>

    <!-- Anillo pequeño flotante -->
    <g transform="translate(840, 2150)">
      <circle cx="0" cy="0" r="110" fill="#ffffff" stroke="#000000" stroke-width="14" />
      <circle cx="0" cy="0" r="85" fill="#000000" stroke="#00f0ff" stroke-width="10" />
      <circle cx="0" cy="0" r="55" fill="#00f0ff" stroke="#000000" stroke-width="8" />
      <circle cx="0" cy="0" r="26" fill="#ffffff" />
    </g>

    <!-- Mini anillo exterior -->
    <g transform="translate(90, 1600)">
      <circle cx="0" cy="0" r="130" fill="#00e5ff" stroke="#000000" stroke-width="14" />
      <circle cx="0" cy="0" r="98" fill="#ffffff" stroke="#000000" stroke-width="10" />
      <circle cx="0" cy="0" r="62" fill="#000000" />
      <circle cx="0" cy="0" r="28" fill="#00f0ff" />
    </g>
  </g>

  <!-- =========================================================
       ESTRELLAS RETRO VECTORIALES (FRUTIGER METRO)
       ========================================================= -->
  <!-- Gran estrella superior izquierda -->
  <use href="#estrellaMetro" transform="translate(420, 240) scale(2.6) rotate(-15)" />
  
  <!-- Estrella media superior -->
  <use href="#estrellaMetro" transform="translate(560, 620) scale(2.0) rotate(22)" />
  
  <!-- Estrella en el borde de la silueta oscura izquierda -->
  <use href="#estrellaMetro" transform="translate(230, 920) scale(1.8) rotate(-8)" />
  <use href="#estrellaSimple" transform="translate(280, 1220) scale(1.6) rotate(35)" />
  <use href="#estrellaSimple" transform="translate(100, 1380) scale(1.1) rotate(-12)" />

  <!-- Estrellas flotantes derecha (en la zona oscura) -->
  <use href="#estrellaMetro" transform="translate(1320, 1080) scale(1.6) rotate(18)" />
  <use href="#estrellaSimple" transform="translate(1420, 1320) scale(1.3) rotate(-25)" />
  <use href="#estrellaSimple" transform="translate(1530, 1550) scale(1.1) rotate(14)" />

  <!-- Estrellas esquina inferior derecha -->
  <use href="#estrellaMetro" transform="translate(1420, 1780) scale(1.5) rotate(-18)" />
  <use href="#estrellaMetro" transform="translate(1050, 1920) scale(1.7) rotate(28)" />
  <use href="#estrellaMetro" transform="translate(1350, 2280) scale(2.8) rotate(12)" />
  <use href="#estrellaSimple" transform="translate(1550, 1980) scale(1.0) rotate(-40)" />

  <!-- =========================================================
       BURBUJAS Y PUNTOS FLOTANTES
       ========================================================= -->
  <g fill="#000000">
    <circle cx="210" cy="650" r="28" stroke="#00e5ff" stroke-width="5" />
    <circle cx="890" cy="740" r="32" stroke="#00e5ff" stroke-width="6" />
    <circle cx="1120" cy="680" r="22" stroke="#ffffff" stroke-width="4" />
    <circle cx="950" cy="1800" r="26" stroke="#00e5ff" stroke-width="5" />
    <circle cx="760" cy="1580" r="18" fill="#00e5ff" />
    <circle cx="1380" cy="1650" r="16" fill="#ffffff" />
    <circle cx="250" cy="1480" r="14" fill="#00e5ff" />
  </g>
</svg>

