spring.application.name=evento
server.port=8081

# Conexión a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/appano_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=microservicio
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL del microservicio de Usuario para OpenFeign (comunicación local previa a Docker)
usuario.service.url=http://localhost:8080/usuarios
